<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Inspiration pin: no selling, just a quote or idea worth saving. Swap --bgc/--fgc for a dark version. */
body{--bgc:var(--cream);--fgc:var(--deep);background:var(--bgc)}
.wrap{position:absolute;left:90px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.eb{color:var(--gold-deep)}
.rule{width:120px;height:6px;background:var(--gold);margin:34px 0}
q{quotes:none;font-family:Fraunces,serif;font-weight:500;font-size:96px;line-height:1.08;color:var(--fgc);text-wrap:balance}
.sub{margin-top:40px;font-size:34px;line-height:1.45;color:var(--muted);max-width:760px}
.mark{position:absolute;left:90px;bottom:80px;display:flex;align-items:center;gap:16px;font-family:Fraunces,serif;font-size:32px;color:var(--fgc)}
.mark img{height:56px;background:#fff;border-radius:12px;padding:6px}
.dots{position:absolute;right:90px;bottom:92px;display:grid;grid-template-columns:repeat(5,14px);gap:12px}
.dots i{width:14px;height:14px;border-radius:50%;background:#DDD6CA}.dots i.o{background:var(--gold)}
</style></head><body>
<div class="wrap">
<div class="eb">Note to self</div>
<div class="rule"></div>
<q>Systems are what let you take the day off.</q>
<p class="sub">Write the process down once: how you quote, book, show up and get paid. Future you will thank you.</p>
</div>
<div class="mark"><img src="src/logo-mark.png">Booked Solid Studio</div>
<div class="dots"><i></i><i></i><i class="o"></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="o"></i></div>
</body></html>
